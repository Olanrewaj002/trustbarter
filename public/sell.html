<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Sell</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon " href="images/trustbarter no words logo.png"/>
    <title>Trustbarter</title>
     <!-- #keywords -->
     <meta name="keywords" content="Declutter, Sell, Swap, Used items," />
     <!-- #description -->
     <meta name="description" content="Declutter, sell, swap, exchange, trade, swap in Lagos, I want to swap, can I swap?, apart from jiji, used items" />
     <!-- #author -->
     <meta name="author" content="Trustbarter"/>
     <!-- Robots: allow indexing -->
     <meta name="robots" content="index, follow"/>

     <link 
    rel="stylesheet" 
    href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css" 
    crossorigin="anonymous"
    />

    <!-- CSS Dependencies and Scripts-->
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link href="./output.css" rel="stylesheet">
    <style>
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;            
      }
    </style>
    <link href="./output.css" rel="stylesheet">
    <style type="text/css">
      html { margin: 0; height: 100%; overflow: hidden; }
      iframe { position: absolute; top: 0; right: 0; bottom: 0; left: 0; border: 0; }
    </style>
  </head>
  <body>
    <!--Nav bar-->
    <header class="sticky top-0 z-50 bg-gradient-to-r from-blue-900 to-black shadow-md" x-data="{ open: false }">
    <div class="max-w-10xl mx-auto px-4 sm:px-6 lg:py-4">
      <div class="flex justify-between items-center py-4">
  
        <!-- Logo -->
        <a href="index.html" class="text-2xl font-bold text-indigo-600 z-50 relative"><img src="images/new-logo-yellow.png" class="w-32 lg:w-40"></a>
        <!-- Desktop Nav -->
        <nav class="hidden md:flex items-center space-x-12">
        <a href="index.html" class="hover:text-indigo-600 text-white/60 text-2xl font-semibold">Home</a>
        <a href="index.html#about" class="hover:text-indigo-600 text-white/60 text-2xl font-semibold">About</a>
        <a href="sell.html" class="hover:text-indigo-600 text-yellow-400 text-2xl font-semibold">Sell</a>
        <a href="swap.html" class="hover:text-indigo-600 text-yellow-400 text-2xl font-semibold">Swap</a>
        <a href="loan.html" class="hover:text-indigo-600 text-yellow-400 text-2xl font-semibold">Loan</a>
        <!--<a href="#" class="hover:text-indigo-600 text-white/60 text-sm font-semibold">Blog</a>
        <a href="#" class="hover:text-indigo-600 text-white/60 text-sm font-semibold">Contact</a> -->
        </nav>
  
        <!-- Desktop Buttons -->
        <div class="hidden md:flex items-center space-x-4 lg:flex gap-4">
          <!--<a href="#contact" class="px-4 py-2 bg-yellow-400 text-sm rounded-md font-bold text-gray-900 hover:bg-indigo-700">Get Started</a>-->
          <a href="#contact" class="px-4 py-2 bg-yellow-400 text-lg rounded-md font-bold text-gray-900 hover:bg-indigo-700">Contact Us</a>
        </div>
  
        <!-- Hamburger -->
        <button @click="open = !open" class="md:hidden p-2 rounded-md text-gray-700 focus:outline-none z-50 relative">
          <svg x-show="!open" x-cloak xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
            viewBox="0 0 24 24" stroke="white">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16" />
          </svg>
          <svg x-show="open" x-cloak xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 " fill="none"
            viewBox="0 0 24 24" stroke="white">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>
  
    <!-- Overlay -->
    <div 
      x-show="open" 
      x-transition.opacity 
      x-cloak 
      @click="open = false"
      class="inset-0 backdrop-blur-2xl z-10 md:hidden fixed"
    ></div>
  
    <!-- Mobile Menu -->
    <div 
      x-show="open" 
      x-transition 
      x-cloak 
      class="fixed top-0 left-0 w-full z-10 mt-16 md:hidden backdrop-blur-lg shadow-lg px-6 pt-4 pb-6 space-y-4"
    >
      <!-- Links -->
    <nav class="flex flex-col mt-10 lg:mt-0 space-y-6 justify-center items-center">
        <a href="#home" @click="open = false" class="hover:text-indigo-600 bg-white/60 p-3 rounded-lg text-black/80 text-lg font-semibold">Home</a>
          <a href="#about" @click="open = false" class="hover:text-indigo-600 bg-white/60 p-3 rounded-lg text-black/80 text-lg font-semibold">About</a>
          <a href="sell.html" @click="open = false"  class="hover:text-indigo-600 bg-white/60 p-3 rounded-lg text-black/80 text-lg font-semibold">Sell</a>
          <a href="swap.html" @click="open = false" class="hover:text-indigo-600 bg-white/60 p-3 rounded-lg text-black/80 text-lg font-semibold">Swap</a>
          <a href="loan.html" @click="open = false" class="hover:text-indigo-600 bg-white/60 p-3 rounded-lg text-black/80 text-lg font-semibold">Loan</a>
          <!--<a href="#" class="hover:text-indigo-600 text-white/60 text-sm font-semibold">Blog</a>
          <a href="#" class="hover:text-indigo-600 text-white/60 text-sm font-semibold">Contact</a> -->
      </nav>
  
      <!-- Buttons -->
    <div class="flex flex-col gap-4 mt-10 mb-6">
        <!--<a href="#get-started" @click="open = false"><button class="w-full bg-yellow-400 py-4 text-black/80 rounded-lg">Get Started</button></a>-->
        <a href="#contact" @click="open = false" class="w-full text-center border border-indigo-600/20 text-2xl text-black/80 bg-white/50 py-4 rounded-lg">Contact Us</a>
      </div>
  
      <!-- Social Icons -->
      <div class="flex justify-center space-x-8 text-black/70 text-3xl mt-6 ">
        <a href="#" class="hover:text-blue-600 bg-white/40 p-2 rounded-sm"><i class="fab fa-facebook-f"></i></a>
        <a href="#" class="hover:text-blue-400 bg-white/40 p-2 rounded-sm"><i class="fab fa-x-twitter"></i></a>
        <a href="#" class="hover:text-pink-500 bg-white/40 p-2 rounded-sm"><i class="fab fa-instagram"></i></a>
        <a href="#" class="hover :text-blue-700 bg-white/40 p-2 rounded-sm"><i class="fab fa-tiktok"></i></a>
      </div>
    </div>
  </header>
  <!--Nav bar end-->
  
  <main class="px-5 md:px-20 py-10">
    <form class="space-y-8" id="sellForm">
      <!-- Location -->
      <div>
        <label class="block text-gray-700 font-semibold mb-2">Your Location</label>
        <select name="location" required class="w-full border border-gray-300 rounded-md px-4 py-3 focus:ring-2 focus:ring-indigo-500">
          <option value="">Select location</option>
          <option value="Lagos">Lagos</option>
          <option value="Abuja">Abuja</option>
        </select>
      </div>

      <!-- Category -->
      <div>
        <label class="block text-gray-700 font-semibold mb-2">Item Category</label>
        <select name="category" required class="w-full border border-gray-300 rounded-md px-4 py-3 focus:ring-2 focus:ring-indigo-500">
          <option value="">Select category</option>
          <option value="Electronics">Electronics</option>
          <option value="Furniture">Furniture</option>
        </select>
      </div>

      <!-- Name of Item -->
      <div>
        <label class="block text-gray-700 font-semibold mb-2">Name of Item</label>
        <input type="text" name="itemName" required class="w-full border border-gray-300 rounded-md px-4 py-3" placeholder="Samsung TV">
      </div>

      <!-- Description -->
      <div>
        <label class="block text-gray-700 font-semibold mb-2">Description</label>
        <textarea name="description" rows="4" required class="w-full border border-gray-300 rounded-md px-4 py-3" placeholder="Describe the item..."></textarea>
      </div>

      <!-- Images Upload Section -->
      <div>
        <label class="block text-gray-700 font-semibold mb-4">Upload Images (4)</label>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- Image Uploads -->
          <div class="relative group">
            <input type="file" name="image1" accept="image/*" class="hidden" onchange="previewImage(this, 'preview1')" />
            <div onclick="this.previousElementSibling.click()" class="cursor-pointer h-48 border-2 border-dashed border-gray-300 rounded-lg flex items-center justify-center bg-white">
              <img id="preview1" class="h-full object-cover hidden" />
              <span class="text-gray-400 group-hover:text-indigo-500">Click to upload Image 1</span>
            </div>
          </div>

          <div class="relative group">
            <input type="file" name="image2" accept="image/*" class="hidden" onchange="previewImage(this, 'preview2')" />
            <div onclick="this.previousElementSibling.click()" class="cursor-pointer h-48 border-2 border-dashed border-gray-300 rounded-lg flex items-center justify-center bg-white">
              <img id="preview2" class="h-full object-cover hidden" />
              <span class="text-gray-400 group-hover:text-indigo-500">Click to upload Image 2</span>
            </div>
          </div>

          <div class="relative group">
            <input type="file" name="image3" accept="image/*" class="hidden" onchange="previewImage(this, 'preview3')" />
            <div onclick="this.previousElementSibling.click()" class="cursor-pointer h-48 border-2 border-dashed border-gray-300 rounded-lg flex items-center justify-center bg-white">
              <img id="preview3" class="h-full object-cover hidden" />
              <span class="text-gray-400 group-hover:text-indigo-500">Click to upload Image 3</span>
            </div>
          </div>

          <div class="relative group">
            <input type="file" name="image4" accept="image/*" class="hidden" onchange="previewImage(this, 'preview4')" />
            <div onclick="this.previousElementSibling.click()" class="cursor-pointer h-48 border-2 border-dashed border-gray-300 rounded-lg flex items-center justify-center bg-white">
              <img id="preview4" class="h-full object-cover hidden" />
              <span class="text-gray-400 group-hover:text-indigo-500">Click to upload Image 4</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Personal Info -->
      <div>
        <label class="block text-gray-700 font-semibold mb-2">Your Name</label>
        <input type="text" name="yourName" required class="w-full border border-gray-300 rounded-md px-4 py-3" placeholder="John Doe">
      </div>

      <div>
        <label class="block text-gray-700 font-semibold mb-2">Phone Number</label>
        <input type="tel" name="phone" required class="w-full border border-gray-300 rounded-md px-4 py-3" placeholder="08012345678">
      </div>

      <div>
        <label class="block text-gray-700 font-semibold mb-2">Email</label>
        <input type="email" name="email" required class="w-full border border-gray-300 rounded-md px-4 py-3" placeholder="you@example.com">
      </div>

      <div class="pt-4">
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-md font-semibold text-lg">
          Submit Item
        </button>
      </div>
    </form>
  </main>

  </body>
</html>
