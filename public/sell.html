     <!--Preview image-->
     <script type="module">
      window.preview = function (input, imgId, placeholderId, loaderId) {
        const file = input.files[0];
        const reader = new FileReader();

        const img = document.getElementById(imgId);
        const placeholder = document.getElementById(placeholderId);
        const loader = document.getElementById(loaderId);

        if (!file) return;

        loader.style.display = "block";
        reader.onload = function (e) {
          img.src = e.target.result;
          img.style.display = "block";
          placeholder.style.display = "none";
          loader.style.display = "none";
        };
        reader.readAsDataURL(file);
      };

     </script>

        <h1 class="text-3xl font-bold text-black/80">Sell Your Item</h1>

    <!-- Sell Form -->
    <form class="px-5 md:px-32 py-10 space-y-8" id="sellForm">
        <!-- Location -->
        <div class="mb-6">
            <label class="block text-gray-700 font-semibold mb-2">Your Location</label>
            <div class="relative lg:w-1/2">
              <select

                required

                <option value="">Select location</option>
                <option value="Lagos">Lagos</option>
                <option value="Abuja">Abuja</option>
                <option value="Port Harcourt">Port Harcourt</option>
                <!-- Add more options as needed -->
              </select>
          
              <!-- Custom arrow icon -->
              <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-400">
                <svg class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor">

                    fill-rule="evenodd"
                    d="M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.71a.75.75 0 111.06 1.06l-4.24 4.24a.75.75 0 01-1.06 0L5.25 8.29a.75.75 0 01-.02-1.08z"
                    clip-rule="evenodd"
                  />
                </svg>
              </div>
            </div>
          </div>
          
    
        <!-- Category -->
        <div class="mb-6 lg:w-1/2">
            <label class="block text-gray-700 font-semibold mb-2">Item Category</label>
            <div class="relative">

                name="category"
                required
                class="w-full appearance-none border border-gray-300 rounded-md px-4 py-3 pr-10 focus:ring-2 focus:ring-yellow-300 bg-white text-gray-700"
              >
                <option value="" class="text-black/50">Select category</option>
                <option value="Electronics">Electronics</option>
                <option value="Furniture">Furniture</option>
                <option value="Fashion">Fashion</option>
                <!-- Add more categories as needed -->
              </select>
          
              <!-- Custom dropdown arrow -->
              <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-400">
                <svg class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor">
                  <path
                    fill-rule="evenodd"
                    d="M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.71a.75.75 0 111.06 1.06l-4.24 4.24a.75.75 0 01-1.06 0L5.25 8.29a.75.75 0 01-.02-1.08z"
                    clip-rule="evenodd"
                  />

              </div>
            </div>
          </div>
    
        <!-- Item Name -->
        <div>
        <label class="block text-gray-700 font-semibold mb-2">Name of Item</label>
        <input type="text" name="itemName" required class="w-full border border-gray-300 rounded-md px-4 py-3 focus:ring-2 focus:ring-yellow-300" placeholder="e.g., Samsung TV">
        </div>

        <!-- Item condition -->
        <div class="mb-6 lg:w-1/2">
            <label class="block text-gray-700 font-semibold mb-2">Condition</label>
            <div class="relative">
              <select
                name="condition"
                required
                class="w-full appearance-none border border-gray-300 rounded-md px-4 py-3 pr-10 focus:ring-2 focus:ring-yellow-300 bg-white text-gray-700"
              >

                    clip-rule="evenodd"
                  />
                </svg>
              </div>
            </div>
          </div>

        <!-- Description -->
        <div>
        <label class="block text-gray-700 font-semibold mb-2">Description</label>
        <textarea name="description" rows="4" required class="w-full border border-gray-300 rounded-md px-4 py-3 focus:ring-2 focus:ring-yellow-300" placeholder="Describe the item..."></textarea>
        </div>
    
        <!-- Price -->
        <div>
          <label class="block text-gray-700 font-semibold mb-2">Price of Item</label>

            <input

              name="price"
              required
              class="w-full border border-gray-300 rounded-md pl-10 pr-4 py-3 focus:ring-2 focus:ring-yellow-300"

            />
          </div>
        </div>
        

        <!-- Image Upload -->
        <div>
          <label class="block font-medium mb-3">Upload Images of your item</label>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

            <!-- Upload Box Template (Repeat for 4 images) -->
            <div class="relative h-48 border border-black/30 rounded-lg flex items-center justify-center overflow-hidden">
              <input id="image1" type="file" accept="image/*" onchange="preview(this, 'img1', 'placeholder1', 'loader1')" class="absolute inset-0 opacity-0 z-10 cursor-pointer" />
              <div class="absolute inset-0 flex items-center justify-center">
                <div id="loader1" class="hidden animate-spin rounded-full h-6 w-6 border-t-2 border-gray-600"></div>
              </div>
              <img id="img1" class="absolute h-full w-full object-cover hidden z-0" />
              <span id="placeholder1" class="text-gray-400 z-0">Click to upload 5MB max</span>
            </div>

            <!-- Repeat same structure for image2 to image4 -->

            <div class="relative h-48 border border-black/30 rounded-lg flex items-center justify-center overflow-hidden">
              <input id="image2" type="file" accept="image/*" onchange="preview(this, 'img2', 'placeholder2', 'loader2')" class="absolute inset-0 opacity-0 z-10 cursor-pointer" />
              <div class="absolute inset-0 flex items-center justify-center">
                <div id="loader2" class="hidden animate-spin rounded-full h-6 w-6 border-t-2 border-gray-600"></div>
              </div>
              <img id="img2" class="absolute h-full w-full object-cover hidden z-0" />
              <span id="placeholder2" class="text-gray-400 z-0">Click to upload 5MB max</span>
            </div>
            

            <div class="relative h-48 border border-black/30 rounded-lg flex items-center justify-center overflow-hidden">
              <input id="image3" type="file" accept="image/*" onchange="preview(this, 'img3', 'placeholder3', 'loader3')" class="absolute inset-0 opacity-0 z-10 cursor-pointer" />
              <div class="absolute inset-0 flex items-center justify-center">
                <div id="loader3" class="hidden animate-spin rounded-full h-6 w-6 border-t-2 border-gray-600"></div>
              </div>
              <img id="img3" class="absolute h-full w-full object-cover hidden z-0" />
              <span id="placeholder3" class="text-gray-400 z-0">Click to upload 5MB max</span>
            </div>

            <div class="relative h-48 border border-black/30 rounded-lg flex items-center justify-center overflow-hidden">
              <input id="image4" type="file" accept="image/*" onchange="preview(this, 'img4', 'placeholder4', 'loader4')" class="absolute inset-0 opacity-0 z-10 cursor-pointer" />
              <div class="absolute inset-0 flex items-center justify-center">
                <div id="loader4" class="hidden animate-spin rounded-full h-6 w-6 border-t-2 border-gray-600"></div>
              </div>
              <img id="img4" class="absolute h-full w-full object-cover hidden z-0" />
              <span id="placeholder4" class="text-gray-400 z-0">Click to upload 5MB max</span>
            </div>

          </div>
        </div>

    
        <!-- Name -->
        <div>
        <label class="block text-gray-700 font-semibold mb-2">Your Name</label>
        <input type="text" name="yourName" required class="w-full border border-gray-300 rounded-md px-4 py-3 focus:ring-2 focus:ring-yellow-300" placeholder="John Doe">
        </div>
    
        <!-- Phone -->
        <div>
        <label class="block text-gray-700 font-semibold mb-2">Phone Number</label>
        <input type="tel" name="phone" required class="w-full border border-gray-300 rounded-md px-4 py-3 focus:ring-2 focus:ring-yellow-300" placeholder="08012345678">
        </div>
    
        <!-- Email -->
        <div>
        <label class="block text-gray-700 font-semibold mb-2">Email</label>
        <input type="email" name="email" required class="w-full border border-gray-300 rounded-md px-4 py-3 focus:ring-2 focus:ring-yellow-300" placeholder="you@example.com">
        </div>
    
        <!-- Submit -->
        <div class="pt-4">
        <button type="submit" class="w-full bg-yellow-400 focus:ring-yellow-300 text-black/80 py-3 rounded-md font-semibold text-lg">
            Submit Item
        </button>
        </div>
    </form>
    <p id="successMessage" class="hidden text-green-600 text-center mt-6 font-semibold">Item submitted successfully!</p>
