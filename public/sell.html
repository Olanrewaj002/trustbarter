  <div class="min-h-screen overflow-auto max-w-6xl mx-auto px-4 md:mx-20 py-10">
    <h1 class="text-3xl font-bold mb-8 text-black/80">Sell Your Item</h1>

    <!-- Sell Form -->
    <form class="bg-gray-50  px-5 md:px-20 py-10 space-y-8" id="sellForm">
        <!-- Location -->
        <div>
        <label class="block text-gray-700 font-semibold mb-2">Your Location</label>
        <select name="location" required class="w-full border border-gray-300 rounded-md px-4 py-3 focus:ring-2 focus:ring-yellow-300">
            <option value="">Select location</option>
            <option value="Lagos">Lagos</option>
            <option value="Abuja">Abuja</option>
            <option value="Port Harcourt">Port Harcourt</option>
            <!-- Add more options as needed -->
        </select>
        </div>
    
        <!-- Category -->
        <div>
        <label class="block text-gray-700 font-semibold mb-2">Item Category</label>
        <select name="category" required class="w-full border border-gray-300 rounded-md px-4 py-3 focus:ring-2 focus:ring-yellow-300">
            <option value="">Select category</option>
            <option value="Electronics">Electronics</option>
            <option value="Furniture">Furniture</option>
            <option value="Fashion">Fashion</option>
            <!-- Add more categories as needed -->
        </select>
        </div>
    
        <!-- Item Name -->
        <div>
        <label class="block text-gray-700 font-semibold mb-2">Name of Item</label>
        <input type="text" name="itemName" required class="w-full border border-gray-300 rounded-md px-4 py-3 focus:ring-2 focus:ring-yellow-300" placeholder="e.g., Samsung TV">
        </div>
    
        <!-- Description -->
        <div>
        <label class="block text-gray-700 font-semibold mb-2">Description</label>
        <textarea name="description" rows="4" required class="w-full border border-gray-300 rounded-md px-4 py-3 focus:ring-2 focus:ring-yellow-300" placeholder="Describe the item..."></textarea>
        </div>
    
        <!-- Image Upload -->
        <div>
            <label class="block font-medium mb-3">Upload Images</label>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- Reusable Image Upload Box -->
            <div class="relative h-48 border-2 border-dashed rounded-lg bg-gray-50 flex items-center justify-center overflow-hidden">
                <input type="file" accept="image/*" onchange="preview(this, 'img1', 'placeholder1')" class="absolute inset-0 opacity-0 z-10 cursor-pointer" />
                <img id="img1" class="absolute h-full w-full object-cover hidden z-0" />
                <span id="placeholder1" class="text-gray-400 z-0">Click to upload</span>
            </div>
            <div class="relative h-48 border-2 border-dashed rounded-lg bg-gray-50 flex items-center justify-center overflow-hidden">
                <input type="file" accept="image/*" onchange="preview(this, 'img2', 'placeholder2')" class="absolute inset-0 opacity-0 z-10 cursor-pointer" />
                <img id="img2" class="absolute h-full w-full object-cover hidden z-0" />
                <span id="placeholder2" class="text-gray-400 z-0">Click to upload</span>
            </div>
            <div class="relative h-48 border-2 border-dashed rounded-lg bg-gray-50 flex items-center justify-center overflow-hidden">
                <input type="file" accept="image/*" onchange="preview(this, 'img3', 'placeholder3')" class="absolute inset-0 opacity-0 z-10 cursor-pointer" />
                <img id="img3" class="absolute h-full w-full object-cover hidden z-0" />
                <span id="placeholder3" class="text-gray-400 z-0">Click to upload</span>
            </div>
            <div class="relative h-48 border-2 border-dashed rounded-lg bg-gray-50 flex items-center justify-center overflow-hidden">
                <input type="file" accept="image/*" onchange="preview(this, 'img4', 'placeholder4')" class="absolute inset-0 opacity-0 z-10 cursor-pointer" />
                <img id="img4" class="absolute h-full w-full object-cover hidden z-0" />
                <span id="placeholder4" class="text-gray-400 z-0">Click to upload</span>
            </div>
            </div>
        </div>
    
        <!-- Name -->
        <div>
        <label class="block text-gray-700 font-semibold mb-2">Your Name</label>
        <input type="text" name="yourName" required class="w-full border border-gray-300 rounded-md px-4 py-3 focus:ring-2 focus:ring-yellow-300" placeholder="John Doe">
        </div>
    
        <!-- Phone -->
        <div>
        <label class="block text-gray-700 font-semibold mb-2">Phone Number</label>
        <input type="tel" name="phone" required class="w-full border border-gray-300 rounded-md px-4 py-3 focus:ring-2 focus:ring-yellow-300" placeholder="08012345678">
        </div>
    
        <!-- Email -->
        <div>
        <label class="block text-gray-700 font-semibold mb-2">Email</label>
        <input type="email" name="email" required class="w-full border border-gray-300 rounded-md px-4 py-3 focus:ring-2 focus:ring-yellow-300" placeholder="you@example.com">
        </div>
    
        <!-- Submit -->
        <div class="pt-4">
        <button type="submit" class="w-full bg-yellow-400 focus:ring-yellow-300 text-black/80 py-3 rounded-md font-semibold text-lg">
            Submit Item
        </button>
        </div>
    </form>
