<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwapSmart - Sell · Swap · Loan Marketplace</title>
    <meta name="description" content="Modern marketplace for selling, swapping, and loaning items">
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#6366f1">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/favicon.ico">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81'
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-in-out',
                        'slide-up': 'slideUp 0.3s ease-out',
                        'scale-in': 'scaleIn 0.2s ease-out'
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes scaleIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .dark .glass {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-50 via-blue-50 to-indigo-100 dark:from-gray-900 dark:via-purple-900 dark:to-indigo-900 min-h-screen transition-colors duration-300">
    <!-- Navigation -->
    <nav class="glass fixed top-0 w-full z-50 px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 bg-gradient-to-r from-purple-500 to-blue-500 rounded-lg flex items-center justify-center">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                </div>
                <h1 class="text-xl font-bold bg-gradient-to-r from-purple-600 to-blue-600 bg-clip-text text-transparent">SwapSmart</h1>
            </div>
            
            <div class="flex items-center space-x-4">
                <button id="darkModeToggle" class="p-2 rounded-lg glass hover:bg-white/20 transition-colors">
                    <svg class="w-5 h-5 text-gray-700 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                    </svg>
                </button>
                <button id="authButton" class="px-4 py-2 bg-gradient-to-r from-purple-500 to-blue-500 text-white rounded-lg hover:shadow-lg transition-all duration-200 transform hover:scale-105">
                    Sign In
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="pt-20 pb-8">
        <!-- Hero Section -->
        <section id="heroSection" class="max-w-7xl mx-auto px-4 py-12 text-center animate-fade-in">
            <h2 class="text-5xl font-bold mb-6 bg-gradient-to-r from-purple-600 via-blue-600 to-indigo-600 bg-clip-text text-transparent">
                Sell · Swap · Loan
            </h2>
            <p class="text-xl text-gray-600 dark:text-gray-300 mb-8 max-w-2xl mx-auto">
                The modern marketplace where you can sell items, swap with others, or get asset-backed loans
            </p>
            
            <!-- Mode Toggle -->
            <div class="flex justify-center mb-8">
                <div class="glass rounded-full p-1 flex space-x-1">
                    <button class="mode-btn active px-6 py-3 rounded-full transition-all duration-200" data-mode="sell">
                        <svg class="w-5 h-5 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1"></path>
                        </svg>
                        Sell
                    </button>
                    <button class="mode-btn px-6 py-3 rounded-full transition-all duration-200" data-mode="swap">
                        <svg class="w-5 h-5 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path>
                        </svg>
                        Swap
                    </button>
                    <button class="mode-btn px-6 py-3 rounded-full transition-all duration-200" data-mode="loan">
                        <svg class="w-5 h-5 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path>
                        </svg>
                        Loan
                    </button>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="max-w-md mx-auto mb-8">
                <div class="relative">
                    <input 
                        type="text" 
                        id="searchInput"
                        placeholder="Search items..."
                        class="w-full px-4 py-3 pl-12 glass rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 text-gray-700 dark:text-gray-300"
                    >
                    <svg class="w-5 h-5 absolute left-4 top-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
            </div>
        </section>

        <!-- Dashboard Section (Hidden by default) -->
        <section id="dashboardSection" class="max-w-7xl mx-auto px-4 hidden">
            <!-- Quick Actions -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <button id="listItemBtn" class="glass p-6 rounded-xl hover:shadow-xl transition-all duration-200 transform hover:scale-105 text-left">
                    <div class="w-12 h-12 bg-gradient-to-r from-green-400 to-blue-500 rounded-lg flex items-center justify-center mb-4">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                        </svg>
                    </div>
                    <h3 class="text-lg font-semibold text-gray-800 dark:text-gray-200 mb-2">List an Item</h3>
                    <p class="text-gray-600 dark:text-gray-400">Add a new item to sell, swap, or loan</p>
                </button>

                <button class="glass p-6 rounded-xl hover:shadow-xl transition-all duration-200 transform hover:scale-105 text-left">
                    <div class="w-12 h-12 bg-gradient-to-r from-purple-400 to-pink-500 rounded-lg flex items-center justify-center mb-4">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                        </svg>
                    </div>
                    <h3 class="text-lg font-semibold text-gray-800 dark:text-gray-200 mb-2">Messages</h3>
                    <p class="text-gray-600 dark:text-gray-400">Check your conversations</p>
                </button>

                <button class="glass p-6 rounded-xl hover:shadow-xl transition-all duration-200 transform hover:scale-105 text-left">
                    <div class="w-12 h-12 bg-gradient-to-r from-yellow-400 to-orange-500 rounded-lg flex items-center justify-center mb-4">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 00-2-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                        </svg>
                    </div>
                    <h3 class="text-lg font-semibold text-gray-800 dark:text-gray-200 mb-2">Analytics</h3>
                    <p class="text-gray-600 dark:text-gray-400">View your performance</p>
                </button>
            </div>

            <!-- Items Grid -->
            <div class="mb-6">
                <h3 class="text-2xl font-bold text-gray-800 dark:text-gray-200 mb-4">Your Items</h3>
                <div id="itemsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                    <!-- Items will be loaded here -->
                </div>
            </div>
        </section>

        <!-- Browse Section -->
        <section id="browseSection" class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold text-gray-800 dark:text-gray-200">Featured Items</h3>
                <div class="flex space-x-2">
                    <select id="categoryFilter" class="glass px-3 py-2 rounded-lg text-gray-700 dark:text-gray-300">
                        <option value="">All Categories</option>
                        <option value="electronics">Electronics</option>
                        <option value="clothing">Clothing</option>
                        <option value="home">Home & Garden</option>
                        <option value="books">Books</option>
                        <option value="sports">Sports</option>
                    </select>
                    <select id="sortFilter" class="glass px-3 py-2 rounded-lg text-gray-700 dark:text-gray-300">
                        <option value="newest">Newest</option>
                        <option value="price-low">Price: Low to High</option>
                        <option value="price-high">Price: High to Low</option>
                        <option value="popular">Most Popular</option>
                    </select>
                </div>
            </div>
            
            <div id="featuredGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- Featured items will be loaded here -->
            </div>
        </section>
    </main>

    <!-- Modals -->
    <!-- Auth Modal -->
    <div id="authModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="glass max-w-md w-full mx-4 p-6 rounded-xl animate-scale-in">
            <h3 class="text-2xl font-bold text-gray-800 dark:text-gray-200 mb-6 text-center">Welcome to SwapSmart</h3>
            
            <form id="authForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Email</label>
                    <input type="email" id="emailInput" required class="w-full px-3 py-2 glass rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 text-gray-700 dark:text-gray-300">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Password</label>
                    <input type="password" id="passwordInput" required class="w-full px-3 py-2 glass rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 text-gray-700 dark:text-gray-300">
                </div>
                <button type="submit" class="w-full py-3 bg-gradient-to-r from-purple-500 to-blue-500 text-white rounded-lg hover:shadow-lg transition-all duration-200">
                    Sign In
                </button>
            </form>
            
            <div class="mt-4 text-center">
                <button id="toggleAuthMode" class="text-purple-600 dark:text-purple-400 hover:underline">
                    Don't have an account? Sign up
                </button>
            </div>
            
            <button id="closeAuthModal" class="absolute top-4 right-4 text-gray-500 hover:text-gray-700">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- List Item Modal -->
    <div id="listItemModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="glass max-w-2xl w-full mx-4 p-6 rounded-xl animate-scale-in max-h-[90vh] overflow-y-auto">
            <h3 class="text-2xl font-bold text-gray-800 dark:text-gray-200 mb-6">List New Item</h3>
            
            <form id="listItemForm" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Title</label>
                        <input type="text" id="itemTitle" required class="w-full px-3 py-2 glass rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 text-gray-700 dark:text-gray-300">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Category</label>
                        <select id="itemCategory" required class="w-full px-3 py-2 glass rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 text-gray-700 dark:text-gray-300">
                            <option value="">Select Category</option>
                            <option value="electronics">Electronics</option>
                            <option value="clothing">Clothing</option>
                            <option value="home">Home & Garden</option>
                            <option value="books">Books</option>
                            <option value="sports">Sports</option>
                        </select>
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Description</label>
                    <textarea id="itemDescription" rows="3" required class="w-full px-3 py-2 glass rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 text-gray-700 dark:text-gray-300"></textarea>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Listing Type</label>
                        <select id="itemType" required class="w-full px-3 py-2 glass rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 text-gray-700 dark:text-gray-300">
                            <option value="sell">For Sale</option>
                            <option value="swap">For Swap</option>
                            <option value="loan">For Loan</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Price ($)</label>
                        <input type="number" id="itemPrice" min="0" step="0.01" class="w-full px-3 py-2 glass rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 text-gray-700 dark:text-gray-300">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Condition</label>
                        <select id="itemCondition" required class="w-full px-3 py-2 glass rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 text-gray-700 dark:text-gray-300">
                            <option value="new">New</option>
                            <option value="like-new">Like New</option>
                            <option value="good">Good</option>
                            <option value="fair">Fair</option>
                            <option value="poor">Poor</option>
                        </select>
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Images</label>
                    <input type="file" id="itemImages" multiple accept="image/*" class="w-full px-3 py-2 glass rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500 text-gray-700 dark:text-gray-300">
                    <div id="imagePreview" class="mt-2 grid grid-cols-3 gap-2"></div>
                </div>
                
                <div class="flex space-x-4">
                    <button type="submit" class="flex-1 py-3 bg-gradient-to-r from-purple-500 to-blue-500 text-white rounded-lg hover:shadow-lg transition-all duration-200">
                        List Item
                    </button>
                    <button type="button" id="closeListModal" class="px-6 py-3 glass rounded-lg hover:bg-white/20 transition-colors text-gray-700 dark:text-gray-300">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div id="loadingSpinner" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="glass p-6 rounded-xl">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-purple-500 mx-auto"></div>
            <p class="text-gray-700 dark:text-gray-300 mt-4 text-center">Loading...</p>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="/js/firebase-init.js"></script>
    <script type="module" src="/js/app.js"></script>
    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(registration => console.log('SW registered'))
                .catch(error => console.log('SW registration failed'));
        }
    </script>
</body>
</html>
